#
# tt-model-manager v5.1 container package for tt-skyreels (SkyReels-V2-DF-1.3B-540P, T2V).
#
#   tt-model package tt_model_package.yaml
#   tt-model serve tsingletary/tt-skyreels
#
# This is a DIFFUSION model, so it uses `kind: tt-dit-server` rather than either vLLM
# kind: there are no tokens, no KV cache and no continuous batching. What it needs is a
# warm pipeline behind a small HTTP surface, which skyreels_ttnn/server/app.py provides
# (modeled directly on tt-animatediff's tt_model_package.yaml / app.py -- the reference
# tt-dit-server package this one follows).
#
# The transformer is TTNN-accelerated via a WAN2.2-derived architecture: SkyReelsV2's
# transformer is weight-compatible with WanTransformer3DModel (models.tt_dit), so this
# model reuses that module wholesale rather than shipping its own kernels -- see
# skyreels_ttnn/pipeline_skyreels.py's module docstring for the compatibility mapping.

schema: "5.1"
name: tt-skyreels
repo: tsingletary/tt-skyreels
# The repo the SERVED path actually loads: SkyReelsPipeline.create_pipeline calls
# SkyReelsV2Transformer3DModel.from_pretrained(checkpoint_name, subfolder="transformer")
# plus the VAE/tokenizer/text_encoder/scheduler subfolders of the SAME repo -- unlike
# tt-animatediff, whose UNet/VAE/tokenizer come from a DIFFERENT repo than the one that
# first looked plausible, this one checkpoint really does hold every component the
# pipeline loads.
weights: Skywork/SkyReels-V2-DF-1.3B-540P-Diffusers
kind: tt-dit-server
arch: blackhole

source:
  # ttnn itself is built from this tree in the image.
  tt_metal:
    repo: https://github.com/tenstorrent/tt-metal
    ref: v0.78.0
  code:
    # models.common carries is_blackhole() and friends, used broadly under tt_dit.
    # models.tt_dit is the WHOLE subtree: SkyReelsTTNNTransformer wraps
    # models.tt_dit.models.transformers.wan2_2.transformer_wan.WanTransformer3DModel
    # directly, which pulls in tt_dit's parallel/, layers/ and blocks/ packages
    # transitively. Listing the one directory rather than hand-picking the closure
    # matches how tt_dit ships for the other pipelines already living there (flux1,
    # flux2, mochi, wan, ...) -- it is designed as a self-contained subtree, not a
    # pick-one-file-at-a-time tree the way models/demos is for tt-animatediff.
    - models/common
    - models/tt_dit
  # The model's own package does NOT live in tt-metal -- it is this repo (tt-skyreels).
  # `extra_code` ships it pinned to a ref so the package is reproducible by whoever
  # pulls it, not only by the machine that built it.
  extra_code:
    - root:
        repo: https://github.com/tsingletaryTT/tt-skyreels
        # A commit, not a branch: reachable from main (confirmed via `git log -1
        # --format=%D`, which shows both HEAD -> main and origin/main), so it survives
        # main moving forward -- same reasoning as tt-animatediff's own ref pin comment.
        ref: 707bfe542d2af5819e29d5156e34eae0cb4418d5
      paths:
        - skyreels_ttnn
  ubuntu: "22.04"
  python: "3.12"

runtime:
  # Resolved by uvicorn exactly as written; covered by source.extra_code above.
  app: skyreels_ttnn.server.app:app
  # The kind's default is FLUX2_MESH_SHAPE, which means nothing to this model. The
  # server reads the name below and refuses a malformed OR unsupported value rather
  # than defaulting -- an unnoticed shape would convert SkyReels' TP/SP split against
  # the wrong mesh and return bad frames, not an error.
  mesh_shape_env: SKYREELS_MESH_SHAPE
  # Beyond the kind's own fastapi/uvicorn/pydantic/pillow. torch comes from the image's
  # CPU build (the kind's verify step asserts +cpu and tt-metal's pin), so it is not
  # listed. imageio + imageio-ffmpeg encode the returned frames to MP4 -- the same
  # encoder tt-inference-server's tt-media-server already depends on for this family.
  packages:
    - diffusers>=0.32.1,<0.41
    - transformers>=4.30.0,<6
    - accelerate>=0.20.0,<2
    - safetensors>=0.4.0,<1
    - sentencepiece
    - protobuf
    - imageio>=2.30,<3
    - imageio-ffmpeg>=0.4,<1
    - numpy<3
    # models/common/utility_functions.py (imported transitively by models.tt_dit.layers.linear,
    # reached from pipeline_skyreels.py's SkyReelsTTNNTransformer.__init__) does `import
    # pytest` at MODULE SCOPE -- a real dependency the image's own image needs even though
    # it never runs a test. Found on real hardware: the mesh opened fine and the crash was
    # this ModuleNotFoundError deep in the lifespan, not a device problem. This is a known
    # tt-metal quirk (see tt-model-package-test skill's own troubleshooting notes).
    - pytest>=7.0.0
    # diffusers.pipelines.skyreels_v2.pipeline_skyreels_v2.basic_clean() calls
    # ftfy.fix_text() unconditionally -- no try/except ImportError guard in this
    # diffusers version -- so it is a real dependency of ENCODING A PROMPT, not an
    # optional extra. Found on real hardware, one generation past the .device fix:
    # NameError: name 'ftfy' is not defined, raised from inside encode_prompt().
    - ftfy>=6.0

serve:
  # QB2, not P300x2: tt-model-manager's own preset table maps "P300x2" to a (1, 4) LINE
  # mesh, but SkyReelsPipeline.create_pipeline derives tp_factor=mesh_shape[1],
  # sp_factor=mesh_shape[0] and was validated at tp=2/sp=2 -- the "QB2 configuration"
  # named in pipeline_skyreels.py's own docstring -- on the same four physical chips.
  # "QB2" is the preset that resolves to (2, 2); "P300x2" would silently open a line and
  # still pass validation, then either fail loading (wrong parallel factors) or produce
  # untested TP=4/SP=1 behavior. Same physical hardware as the flux2-dev-qb2 precedent
  # package on the Hub, which uses the same preset for the same reason.
  hardware: p300x2
  mesh_device: QB2
  port: 8000

verify:
  # Beyond the kind's own check (imports the ASGI app). Proves the pipeline module
  # itself is importable with no card, matching tt-animatediff's verify_lines pattern --
  # a missing allowlist entry for models.tt_dit fails here, on the author's machine.
  - "from skyreels_ttnn.pipeline_skyreels import SkyReelsPipeline, SkyReelsTTNNTransformer"
  - "from skyreels_ttnn.server.app import mesh_shape_from_env, SUPPORTED_MESH_SHAPES; assert (2, 2) in SUPPORTED_MESH_SHAPES"
